<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FHIR interactions for the SCD Emergency Care use case</title>
  <desc id="d">Sequence of FHIR interactions between the emergency department system (USCDI-SCD Client) and a system holding the patient's record (USCDI-SCD Server): locate the patient, authorize access, retrieve SCD-relevant resources with US Core searches, and use the data.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <style>
      .actor{fill:#eaf1fb;stroke:#2f5597;stroke-width:1.5}
      .lbl{font-size:15px;fill:#1f1f1f;text-anchor:middle;font-weight:bold}
      .sub{font-size:12px;fill:#404040;text-anchor:middle}
      .life{stroke:#8faadc;stroke-width:1.5;stroke-dasharray:6 5}
      .req{stroke:#1f3864;stroke-width:1.5;marker-end:url(#a)}
      .resp{stroke:#2e7d32;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#r)}
      .code{font-family:Consolas, "Courier New", monospace;font-size:12.5px;fill:#1f3864}
      .rtext{font-size:12.5px;fill:#2e7d32}
      .phase{fill:#f7f9fc;stroke:#d0d8e8}
      .ph{font-size:13px;font-weight:bold;fill:#2f5597}
      .open{font-size:12px;fill:#9c5700;font-style:italic}
      .note{font-size:12.5px;fill:#404040}
    </style>
  </defs>

  <!-- Actors -->
  <rect x="40" y="20" width="250" height="62" rx="8" class="actor"/>
  <text x="165" y="47" class="lbl">Emergency department system</text>
  <text x="165" y="67" class="sub">USCDI-SCD Client</text>
  <rect x="680" y="20" width="300" height="62" rx="8" class="actor"/>
  <text x="830" y="47" class="lbl">System holding the patient's record</text>
  <text x="830" y="67" class="sub">USCDI-SCD Server (for example, an EHR)</text>
  <line x1="165" y1="82" x2="165" y2="735" class="life"/>
  <line x1="830" y1="82" x2="830" y2="735" class="life"/>

  <!-- Step 1 -->
  <rect x="20" y="96" width="960" height="92" rx="6" class="phase"/>
  <text x="32" y="114" class="ph">Step 1: Locate the patient</text>
  <line x1="165" y1="136" x2="828" y2="136" class="req"/>
  <text x="500" y="130" class="code" text-anchor="middle">GET [base]/Patient?identifier=[system]|[value]</text>
  <line x1="830" y1="160" x2="167" y2="160" class="resp"/>
  <text x="500" y="154" class="rtext" text-anchor="middle">Bundle (searchset) with the matching Patient</text>
  <text x="32" y="180" class="open">This search is made with the authorization obtained in Step 2. Record location and patient matching are open questions (OQ-1 to OQ-3).</text>

  <!-- Step 2 -->
  <rect x="20" y="198" width="960" height="78" rx="6" class="phase"/>
  <text x="32" y="216" class="ph">Step 2: Authorize access</text>
  <line x1="165" y1="238" x2="828" y2="238" class="req"/>
  <text x="500" y="232" class="code" text-anchor="middle">SMART App Launch authorization request</text>
  <line x1="830" y1="258" x2="167" y2="258" class="resp"/>
  <text x="500" y="252" class="rtext" text-anchor="middle">Access token</text>
  <text x="32" y="270" class="open">Authorization between organizations and SMART scopes are open questions (OQ-4).</text>

  <!-- Step 3 -->
  <rect x="20" y="286" width="960" height="372" rx="6" class="phase"/>
  <text x="32" y="304" class="ph">Step 3: Retrieve SCD-relevant data (US Core searches, each returning a searchset Bundle)</text>
  <g>
    <line x1="165" y1="330" x2="828" y2="330" class="req"/><text x="500" y="324" class="code" text-anchor="middle">GET [base]/Condition?patient=[id]</text>
    <text x="500" y="346" class="rtext" text-anchor="middle">SCD diagnosis with subtype (problem list) and encounter diagnoses</text>
    <line x1="165" y1="374" x2="828" y2="374" class="req"/><text x="500" y="368" class="code" text-anchor="middle">GET [base]/AllergyIntolerance?patient=[id]</text>
    <text x="500" y="390" class="rtext" text-anchor="middle">Allergies and intolerances</text>
    <line x1="165" y1="418" x2="828" y2="418" class="req"/><text x="500" y="412" class="code" text-anchor="middle">GET [base]/MedicationRequest?patient=[id]&amp;intent=order</text>
    <text x="500" y="434" class="rtext" text-anchor="middle">Prescriptions, such as hydroxyurea and iron chelation</text>
    <line x1="165" y1="462" x2="828" y2="462" class="req"/><text x="500" y="456" class="code" text-anchor="middle">GET [base]/Observation?patient=[id]&amp;category=laboratory</text>
    <text x="500" y="478" class="rtext" text-anchor="middle">Laboratory results, such as hemoglobin fractionation</text>
    <line x1="165" y1="506" x2="828" y2="506" class="req"/><text x="500" y="500" class="code" text-anchor="middle">GET [base]/Observation?patient=[id]&amp;category=vital-signs</text>
    <text x="500" y="522" class="rtext" text-anchor="middle">Vital signs and pain scores</text>
    <line x1="165" y1="550" x2="828" y2="550" class="req"/><text x="500" y="544" class="code" text-anchor="middle">GET [base]/CarePlan?patient=[id]&amp;category=assess-plan</text>
    <text x="500" y="566" class="rtext" text-anchor="middle">Care plans, such as a chronic transfusion plan</text>
    <line x1="165" y1="594" x2="828" y2="594" class="req"/><text x="500" y="588" class="code" text-anchor="middle">GET [base]/Encounter?patient=[id]  ·  GET [base]/Procedure?patient=[id]</text>
    <text x="500" y="610" class="rtext" text-anchor="middle">Previous visits and procedures, such as transfusions</text>
  </g>
  <text x="32" y="636" class="open">Which resources make up an "SCD-focused query" (OQ-5) and how blood product records are retrieved (OQ-7) are open questions.</text>
  <text x="32" y="652" class="note">Searches are required (SHALL) by the US Core 8.0.1 Server CapabilityStatement, which the USCDI-SCD Server CapabilityStatement imports.</text>

  <!-- Step 4 -->
  <rect x="20" y="668" width="960" height="62" rx="6" class="phase"/>
  <text x="32" y="686" class="ph">Step 4: Use the data</text>
  <path d="M167 700 L240 700 L240 718 L171 718" fill="none" stroke="#1f3864" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="252" y="713" class="note">Process Must Support elements, handle missing data and display the patient's SCD history to the care team</text>

  <text x="20" y="770" class="note">Solid arrows: requests. Dashed arrows: responses. Requests may be routed through a data intermediary (see Figure 1).</text>
  <text x="20" y="790" class="note">[base] is the server's FHIR base URL; [id] is the Patient id returned in Step 1.</text>
</svg>
