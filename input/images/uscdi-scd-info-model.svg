<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">USCDI-SCD information model</title>
  <desc id="d">Information concepts exchanged in the USCDI-SCD use cases and their relationships. Read each relationship from the line's start to its arrowhead.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5597"/></marker>
    <style>
      .c{fill:#4472c4;stroke:#2f5597;stroke-width:1.5}
      .ct{font-size:15px;fill:#fff;text-anchor:middle}
      .e{stroke:#2f5597;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .el{font-size:12px;fill:#1f3864;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    </style>
  </defs>

  <!-- Concepts (x, y, 150 x 60) -->
  <g>
    <rect x="440" y="20"  width="160" height="60" rx="4" class="c"/><text x="520" y="55"  class="ct">Encounter Diagnosis</text>
    <rect x="440" y="150" width="160" height="60" rx="4" class="c"/><text x="520" y="185" class="ct">Condition / Problem</text>
    <rect x="160" y="250" width="150" height="60" rx="4" class="c"/><text x="235" y="285" class="ct">Encounter</text>
    <rect x="20"  y="400" width="150" height="60" rx="4" class="c"/><text x="95"  y="435" class="ct">Facility</text>
    <rect x="700" y="250" width="150" height="60" rx="4" class="c"/><text x="775" y="285" class="ct">Patient</text>
    <rect x="960" y="150" width="150" height="60" rx="4" class="c"/><text x="1035" y="185" class="ct">Allergy</text>
    <rect x="1070" y="330" width="150" height="60" rx="4" class="c"/><text x="1145" y="365" class="ct">Lab Result</text>
    <rect x="200" y="480" width="150" height="60" rx="4" class="c"/><text x="275" y="515" class="ct">Practitioner</text>
    <rect x="590" y="480" width="150" height="60" rx="4" class="c"/><text x="665" y="515" class="ct">Order</text>
    <rect x="860" y="410" width="150" height="60" rx="4" class="c"/><text x="935" y="445" class="ct">Lab Test</text>
    <rect x="400" y="640" width="150" height="60" rx="4" class="c"/><text x="475" y="675" class="ct">Care Plan</text>
    <rect x="860" y="540" width="150" height="60" rx="4" class="c"/><text x="935" y="575" class="ct">Procedure</text>
    <rect x="860" y="660" width="150" height="60" rx="4" class="c"/><text x="935" y="695" class="ct">Medication</text>
    <rect x="1070" y="540" width="150" height="60" rx="4" class="c"/><text x="1145" y="567" class="ct">Biologically</text><text x="1145" y="585" class="ct">Derived Product</text>
  </g>

  <!-- Relationships (read from line start to arrowhead) -->
  <!-- Encounter Diagnosis is recorded during Encounter -->
  <path d="M440 40 L235 40 L235 246" class="e"/><text x="330" y="44" class="el">Is recorded during</text>
  <!-- Encounter Diagnosis is evidenced by Lab Result -->
  <path d="M600 40 L1185 40 L1185 326" class="e"/><text x="900" y="44" class="el">Is evidenced by</text>
  <!-- Condition is evidenced by Lab Result -->
  <path d="M600 165 L700 165 L700 120 L1130 120 L1130 326" class="e"/><text x="900" y="124" class="el">Is evidenced by</text>
  <!-- Patient has Condition -->
  <path d="M760 250 L760 195 L604 195" class="e"/><text x="690" y="199" class="el">Has</text>
  <!-- Patient may have Allergy -->
  <path d="M850 265 L905 265 L905 180 L956 180" class="e"/><text x="905" y="228" class="el">May have</text>
  <!-- Encounter is for / focuses on Patient -->
  <path d="M310 290 L696 290" class="e"/><text x="500" y="294" class="el">Is for / focuses on</text>
  <!-- Encounter occurs at Facility -->
  <path d="M160 270 L95 270 L95 396" class="e"/><text x="95" y="330" class="el">Occurs at</text>
  <!-- Practitioner provides care during Encounter -->
  <path d="M250 480 L250 314" class="e"/><text x="250" y="400" class="el">Provides care during</text>
  <!-- Practitioner writes Encounter Diagnosis -->
  <path d="M350 495 L380 495 L380 65 L436 65" class="e"/><text x="380" y="140" class="el">Writes</text>
  <!-- Practitioner records Condition -->
  <path d="M350 520 L480 520 L480 214" class="e"/><text x="480" y="360" class="el">Records</text>
  <!-- Practitioner works at Facility -->
  <path d="M200 510 L95 510 L95 464" class="e"/><text x="140" y="514" class="el">Works at</text>
  <!-- Practitioner contributes to Care Plan -->
  <path d="M275 540 L275 670 L396 670" class="e"/><text x="320" y="674" class="el">Contributes</text>
  <!-- Care Plan may include Order -->
  <path d="M550 670 L640 670 L640 544" class="e"/><text x="640" y="610" class="el">May include</text>
  <!-- Order is written for Patient -->
  <path d="M700 480 L700 400 L790 400 L790 314" class="e"/><text x="745" y="404" class="el">Is written for</text>
  <!-- Order may be for Lab Test -->
  <path d="M740 495 L800 495 L800 440 L856 440" class="e"/><text x="800" y="470" class="el">May be for</text>
  <!-- Order may be for Procedure -->
  <path d="M740 525 L800 525 L800 570 L856 570" class="e"/><text x="800" y="552" class="el">May be for</text>
  <!-- Order may be for Medication -->
  <path d="M700 540 L700 690 L856 690" class="e"/><text x="780" y="694" class="el">May be for</text>
  <!-- Lab Test may have Lab Result -->
  <path d="M1010 440 L1100 440 L1100 394" class="e"/><text x="1050" y="444" class="el">May have</text>
  <!-- Procedure may include Biologically Derived Product -->
  <path d="M1010 570 L1066 570" class="e"/><text x="1038" y="560" class="el">May include</text>

  <text x="20" y="748" font-size="12.5" fill="#404040">Read each relationship from the start of the line to the arrowhead. Cardinality is not shown, and FHIR references may point in either direction.</text>
</svg>
